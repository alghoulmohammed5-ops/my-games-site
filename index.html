  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألعاب زمان والذكريات</title>
<style>
body {
font-family: Tahoma, sans-serif;
background: linear-gradient(135deg, #1e1e2f, #2a2a40);
color: #ffffff;
text-align: center;
padding: 50px;
margin: 0;
}
h1 {
color: #ffd700;
font-size: 2.5em;
margin-bottom: 10px;
}
p {
font-size: 1.2em;
color: #cccccc;
}
.game-box {
background: #3a3a55;
padding: 30px;
border-radius: 15px;
display: inline-block;
margin-top: 20px;
box-shadow: 0 8px 16px rgba(0,0,0,0.3);
}
button {
background-color: #ff4757;
color: white;
border: none;
padding: 12px 25px;
font-size: 18px;
border-radius: 8px;
cursor: pointer;
font-weight: bold;
transition: 0.3s;
}
button:hover {
background-color: #ff6b81;
}
#score {
font-size: 24px;
color: #2ed573;
margin-top: 15px;
font-weight: bold;
}
</style>
</head>
<body>
<h1>🎮 أهلاً بكم في عالم الذكريات والألعاب</h1>
<p>ستجدون في صفحتي كل ما هو قديم وجميل..</p>
<div class="game-box">
<h3>لعبة التحدي السريع</h3>
<p>اضغط على الزر بأسرع ما يمكنك لجمع النقاط!</p>
<button onclick="increaseScore()">اضغط هنا للعب! 🚀</button>
<div id="score">النقاط: 0</div>
</div>
<script>
let score = 0;
function increaseScore() {
score++;
document.getElementById("score").innerText = "النقاط: " + score;
}
</script>
</body>
</html>
